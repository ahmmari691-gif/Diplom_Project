# Existing Render web service; PostgreSQL is hosted separately in Supabase.
services:
  - type: web
    name: delo-doma
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: "delo-doma 2"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DELO_DEMO
        value: "0"
      - key: DELO_AI_MODE
        value: local
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Supabase Session pooler URI; set securely in Render
      - key: DB_SSLMODE
        value: require
      - key: DB_SCHEMA
        value: app
