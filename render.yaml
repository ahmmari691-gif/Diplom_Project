# Free preview deployment. Free PostgreSQL expires after 30 days.
services:
  - type: web
    name: delo-doma
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: "delo-doma 2"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DELO_DEMO
        value: "0"
      - key: DELO_AI_MODE
        value: local
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: delo-doma-db
          property: connectionString
      - key: DB_SSLMODE
        value: require

databases:
  - name: delo-doma-db
    plan: free
    region: frankfurt
    databaseName: delo_doma
    user: delo_doma
